[project]
name = "ancseq"
version = "1.3.0"
description = "Ancestral sequence reconstruction with gap-state inference using IQ-TREE"
readme = "README.md"
requires-python = ">=3.8"

authors = [
    { name = "Yu Sugihara", email = "sugihara.yu.85s@kyoto-u.jp" }
]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "biopython"
]

keywords = [
    "ancestral sequence reconstruction",
    "ancestral protein reconstruction",
    "ancestral state reconstruction",
    "ASR",
    "phylogenetics",
    "molecular evolution",
    "gap-state inference",
    "indel reconstruction",
    "IQ-TREE",
    "bioinformatics"
]

[project.urls]
Homepage = "https://github.com/YuSugihara/ancseq"
Source = "https://github.com/YuSugihara/ancseq"
Issues = "https://github.com/YuSugihara/ancseq/issues"
Changelog = "https://github.com/YuSugihara/ancseq/releases"
Citation = "https://doi.org/10.1371/journal.pgen.1011653"

[project.scripts]
ancseq = "ancseq.ancseq:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ancseq"]
